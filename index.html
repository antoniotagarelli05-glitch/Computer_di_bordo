<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPU-6050 Tilt Monitor 3D</title>
<style>
  body { margin:0; background:#0d1117; color:#e6edf3; font-family: Arial, Helvetica, sans-serif; overflow:hidden; }
  #pannello {
    position:absolute; top:16px; left:16px; z-index:10;
    background:rgba(15,20,30,0.85); padding:14px 18px; border-radius:10px;
    border:1px solid #2a3644; min-width:220px;
  }
  #pannello h2 { margin:0 0 8px 0; font-size:16px; color:#58a6ff; }
  .riga { display:flex; justify-content:space-between; font-size:14px; margin:3px 0; }
  .valore { font-weight:bold; color:#e6edf3; }
  #stato {
    margin-top:10px; padding:8px 10px; border-radius:6px; font-weight:bold; text-align:center;
    font-size:14px;
  }
  .stabile { background:#1f6feb33; color:#58a6ff; }
  .attenzione { background:#f0883e33; color:#f0883e; }
  #connessione {
    position:absolute; top:16px; right:16px; z-index:10; font-size:13px;
    padding:6px 10px; border-radius:6px; background:rgba(15,20,30,0.85);
  }
  .online { color:#3fb950; }
  .offline { color:#f85149; }
  canvas { display:block; }
</style>
</head>
<body>

<div id="pannello">
  <h2>MPU-6050 Tilt Monitor</h2>
  <div class="riga"><span>Rollio (X)</span><span class="valore" id="valRoll">0.0°</span></div>
  <div class="riga"><span>Beccheggio (Y)</span><span class="valore" id="valPitch">0.0°</span></div>
  <div class="riga"><span>Imbardata (Z)</span><span class="valore" id="valYaw">0.0°</span></div>
  <div id="stato" class="stabile">Stabile</div>
</div>

<div id="connessione">WebSocket: <span id="statoConnessione" class="offline">disconnesso</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------------- SCENA 3D ----------------
const scena = new THREE.Scene();
scena.background = new THREE.Color(0x0d1117);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(4, 3, 6);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Griglia di riferimento (il "piano")
const griglia = new THREE.GridHelper(10, 20, 0x2a3644, 0x1c2531);
scena.add(griglia);

// Assi di riferimento
scena.add(new THREE.AxesHelper(3));

// Luci
scena.add(new THREE.AmbientLight(0xffffff, 0.6));
const luceDirezionale = new THREE.DirectionalLight(0xffffff, 0.8);
luceDirezionale.position.set(5,10,7);
scena.add(luceDirezionale);

// Oggetto che rappresenta il sensore/veicolo
const geometria = new THREE.BoxGeometry(3, 0.3, 1.5);
const materiale = new THREE.MeshStandardMaterial({color:0x58a6ff, metalness:0.3, roughness:0.5});
const oggetto = new THREE.Mesh(geometria, materiale);
oggetto.position.y = 0.5;
scena.add(oggetto);

// Piccola freccia per indicare la direzione "frontale"
const conoGeom = new THREE.ConeGeometry(0.25, 0.6, 12);
const conoMat = new THREE.MeshStandardMaterial({color:0xf0883e});
const cono = new THREE.Mesh(conoGeom, conoMat);
cono.rotation.z = -Math.PI/2;
cono.position.set(1.8, 0.5, 0);
scena.add(cono);

function animazione() {
  requestAnimationFrame(animazione);
  renderer.render(scena, camera);
}
animazione();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------- WEBSOCKET ----------------
let socket;
function connettiWebSocket() {
  const protocollo = (location.protocol === 'https:') ? 'wss://' : 'ws://';
  socket = new WebSocket(protocollo + location.host + '/ws');

  socket.onopen = () => {
    document.getElementById('statoConnessione').textContent = 'connesso';
    document.getElementById('statoConnessione').className = 'online';
  };

  socket.onclose = () => {
    document.getElementById('statoConnessione').textContent = 'disconnesso';
    document.getElementById('statoConnessione').className = 'offline';
    setTimeout(connettiWebSocket, 1500); // riconnessione automatica
  };

  socket.onmessage = (evento) => {
    const dati = JSON.parse(evento.data);

    document.getElementById('valRoll').textContent = dati.roll.toFixed(1) + '°';
    document.getElementById('valPitch').textContent = dati.pitch.toFixed(1) + '°';
    document.getElementById('valYaw').textContent = dati.yaw.toFixed(1) + '°';

    const statoEl = document.getElementById('stato');
    statoEl.textContent = dati.stato;
    statoEl.className = dati.allarme ? 'attenzione' : 'stabile';

    // Applica rotazioni all'oggetto 3D (gradi -> radianti)
    oggetto.rotation.z = -dati.roll  * Math.PI / 180;  // rollio attorno asse longitudinale
    oggetto.rotation.x =  dati.pitch * Math.PI / 180;  // beccheggio attorno asse trasversale
    oggetto.rotation.y =  dati.yaw   * Math.PI / 180;  // imbardata attorno asse verticale

    cono.rotation.copy(oggetto.rotation);
    cono.position.set(
      1.8 * Math.cos(dati.yaw * Math.PI/180),
      0.5,
      1.8 * Math.sin(dati.yaw * Math.PI/180)
    );
  };
}
connettiWebSocket();
</script>
</body>
</html>
)rawliteral";
